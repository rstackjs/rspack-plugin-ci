packages:
  - 'sri-plugin/examples/*'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  puppeteer: false

minimumReleaseAgeExclude:
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rslint/*'
  - '@rspack/*'
  - '@rspress/*'
  - '@rstackjs/*'
  - '@rstest/*'
  - '@typescript/*'
  - 'rsbuild-plugin-*'
  - rstack
  - typescript

peerDependencyRules:
  allowAny:
    - '@rspack/*'
