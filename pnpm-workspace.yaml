packages:
  - 'sri-plugin/examples/*'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  puppeteer: false

minimumReleaseAgeExclude:
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rslint/*'
  - '@rspack/*'
  - '@rspress/*'
  - '@rstackjs/*'
  - '@rstest/*'
  - '@typescript/*'
  - 'rsbuild-plugin-*'
  - rstack
  - typescript

overrides:
  '@rspack/cli': '2.3.4'
  '@rspack/core': '2.3.4'

peerDependencyRules:
  allowAny:
    - '@rspack/*'

permissions:
  rstack:
    skills:
      - rstack-cli-docs
